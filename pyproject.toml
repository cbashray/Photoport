[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photoport"
version = "1.0.0"
description = "Windows desktop application for migrating Google Photos Takeout archives"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "PhotoPort"}
]

dependencies = [
    "PySide6>=6.6.0",
    "google-auth>=2.28.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.120.0",
    "requests>=2.31.0",
    "keyring>=25.0.0",
    "piexif>=1.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "pyinstaller>=6.4.0",
]

[project.scripts]
photoport = "photoport.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "N802"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
